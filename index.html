<!DOCTYPE html>
<html>
<head>
    <title>Browser Hangman</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        #hangman {
            border: 1px solid #ccc;
            margin: 20px auto;
        }
        .letter {
            display: inline-block;
            margin: 0 5px;
            font-size: 24px;
        }
        #keyboard {
            margin: 20px;
        }
    </style>
</head>
<body>
    <h1>Hangman</h1>
    <canvas id="hangman" width="300" height="200"></canvas>
    <div id="word"></div>
    <div id="used-letters"></div>
    <input type="text" id="guess" maxlength="1" placeholder="Enter a letter">
    <button onclick="makeGuess()">Guess</button>

    <script>
        const words = ['JAVASCRIPT', 'FUNCTION', 'VARIABLE', 'OBJECT', 'ARRAY', 'BROWSER'];
        let selectedWord = '';
        let guessedLetters = [];
        let mistakes = 0;
        const maxMistakes = 6;

        function initGame() {
            selectedWord = words[Math.floor(Math.random() * words.length)];
            guessedLetters = [];
            mistakes = 0;
            updateDisplay();
            drawHangman();
        }

        function updateDisplay() {
            const wordDisplay = selectedWord.split('').map(letter => 
                guessedLetters.includes(letter) ? letter : '_'
            ).join(' ');

            document.getElementById('word').innerHTML = wordDisplay
                .split('').join('</span><span class="letter">');

            document.getElementById('used-letters').textContent = 
                `Used letters: ${guessedLetters.join(', ')}`;
        }

        function drawHangman() {
            const canvas = document.getElementById('hangman');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw gallows
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            if (mistakes >= 1) ctx.beginPath(), ctx.moveTo(50, 180), ctx.lineTo(150, 180), ctx.stroke();  // Base
            if (mistakes >= 2) ctx.beginPath(), ctx.moveTo(100, 180), ctx.lineTo(100, 50), ctx.stroke();   // Pole
            if (mistakes >= 3) ctx.beginPath(), ctx.moveTo(100, 50), ctx.lineTo(180, 50), ctx.stroke();    // Beam
            if (mistakes >= 4) ctx.beginPath(), ctx.moveTo(180, 50), ctx.lineTo(180, 70), ctx.stroke();    // Rope
            if (mistakes >= 5) {  // Head
                ctx.beginPath();
                ctx.arc(180, 80, 10, 0, Math.PI * 2);
                ctx.stroke();
            }
            if (mistakes >= 6) {  // Body
                ctx.beginPath(), ctx.moveTo(180, 90), ctx.lineTo(180, 140), ctx.stroke();
            }
        }

        function makeGuess() {
            const input = document.getElementById('guess');
            const letter = input.value.toUpperCase();
            input.value = '';

            if (!letter.match(/[A-Z]/) || guessedLetters.includes(letter)) return;

            guessedLetters.push(letter);
            
            if (!selectedWord.includes(letter)) {
                mistakes++;
                drawHangman();
            }

            updateDisplay();
            checkGameState();
        }

        function checkGameState() {
            if (mistakes >= maxMistakes) {
                alert(`Game Over! The word was: ${selectedWord}`);
                initGame();
            }
            if ([...selectedWord].every(letter => guessedLetters.includes(letter))) {
                alert('Congratulations! You won!');
                initGame();
            }
        }

        // Initialize game on load
        window.onload = initGame;
    </script>
</body>
</html>
